<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:'Cairo',system-ui,sans-serif}
  body{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
    background:#0f172a;
  }

  /* Top switcher */
  .switcher{
    display:flex;gap:8px;padding:10px 12px;flex-shrink:0;
    background:linear-gradient(135deg,#12304f 0%,#6c5ce7 100%);
    box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:10;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .switcher button{
    flex:1;padding:11px 12px;border:0;border-radius:12px;
    font-family:inherit;font-weight:800;font-size:13px;
    color:rgba(255,255,255,.72);background:rgba(255,255,255,.1);
    cursor:pointer;transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .switcher button.active{
    background:#fff;color:#12304f;box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
  .switcher button:hover:not(.active){background:rgba(255,255,255,.22);color:#fff}

  .install-toggle{
    flex:0 0 auto !important;max-width:44px;
    background:rgba(255,255,255,.18) !important;color:#fff !important;
    font-size:16px !important;padding:11px 12px !important;
  }
  .install-toggle.hidden{display:none !important}

  /* Install banner */
  .install-banner{
    display:none;align-items:center;gap:10px;padding:11px 14px;
    background:linear-gradient(90deg,#f59e0b,#f97316);color:#3b2600;
    font-weight:700;font-size:13px;flex-shrink:0;
    animation:slideDown .35s ease;
  }
  .install-banner.show{display:flex}
  .install-banner .msg{flex:1;line-height:1.4}
  .install-banner .msg small{display:block;font-weight:600;font-size:11px;opacity:.85}
  .install-banner button{
    border:0;border-radius:9px;padding:8px 14px;font-family:inherit;
    font-weight:800;font-size:12px;cursor:pointer;transition:.15s;
    background:#12304f;color:#fff;
  }
  .install-banner button:hover{filter:brightness(1.1)}
  .install-banner .close-x{
    background:transparent;color:#3b2600;font-size:15px;padding:5px 8px;
  }
  .install-banner .close-x:hover{background:rgba(0,0,0,.08)}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* Frames */
  .frame-wrap{flex:1;position:relative;overflow:hidden;background:#f0f0f5}
  iframe{
    position:absolute;inset:0;width:100%;height:100%;
    border:0;display:block;background:transparent;
  }
  iframe.hidden{display:none}

  /* Toast */
  .app-toast{
    position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);
    background:#1b1b2f;color:#fff;padding:12px 22px;border-radius:14px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;
    transition:.3s;z-index:9999;white-space:nowrap;max-width:90vw;
    box-shadow:0 10px 30px rgba(20,20,50,.4);
  }
  .app-toast.show{opacity:1;transform:translate(-50%,0)}

  /* Hide install banner in installed mode */
  body.installed .install-banner{display:none !important}
  body.installed .install-toggle{display:none !important}
</style>
</head>
<body>

<div class="switcher">
  <button data-app="concrete" class="active" onclick="showApp('concrete')">
    <span>🏗️</span> حاسبة المقاولات
  </button>
  <button data-app="budget" onclick="showApp('budget')">
    <span>💸</span> ميزانية الشراكة
  </button>
  <button class="install-toggle hidden" id="installToggle" onclick="triggerInstall()" title="تثبيت التطبيق">⬇️</button>
</div>

<div class="install-banner" id="installBanner">
  <div class="msg">
    📱 ثبّت التطبيق على جهازك
    <small>للفتح السريع والعمل بدون إنترنت</small>
  </div>
  <button onclick="triggerInstall()">تثبيت</button>
  <button class="close-x" onclick="dismissBanner()">✕</button>
</div>

<div class="frame-wrap">
  <iframe id="concrete-frame" title="حاسبة المقاولات"></iframe>
  <iframe id="budget-frame" class="hidden" title="ميزانية الشراكة"></iframe>
</div>

<div class="app-toast" id="appToast"></div>

  .split-total.ok{background:rgba(0,184,148,.14);color:#00a383}

  .modal-foot{display:flex;gap:10px;margin-top:8px}

  .toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);
    background:#1b1b2f;color:#fff;padding:11px 18px;border-radius:14px;

  body.dark .toast{background:#2a2a4a}

</style>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = {
  food:{label:'أكل وشرب',icon:'🍽️',color:'#E17055'},
  transport:{label:'مواصلات',icon:'🚗',color:'#0984E3'},
  entertainment:{label:'ترفيه',icon:'🎮',color:'#A29BFE'},
  shopping:{label:'تسوق',icon:'🛒',color:'#E84393'},
  bills:{label:'فواتير',icon:'📄',color:'#00B894'},
  rent:{label:'إيجار',icon:'🏠',color:'#FDCB6E'},
  travel:{label:'سفر',icon:'✈️',color:'#00CEC9'},
  other:{label:'أخرى',icon:'📦',color:'#8a8aa3'}
};
const STORAGE_KEY='friends-budget-v1';
const THEME_KEY='friends-budget-theme';
const PALETTE=['#6C5CE7','#00B894','#E17055','#0984E3','#E84393','#FDCB6E','#00CEC9','#D63031','#A29BFE','#55EFC4','#FD79A8','#74B9FF','#F39C12','#16A085'];
let state=loadState();
let editingId=null, viewingMemberId=null, toastTimer;
let filterSearch='', filterCat='all', filterSort='date-desc';

function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(r){const s=JSON.parse(r);return{members:Array.isArray(s.members)?s.members:[],expenses:Array.isArray(s.expenses)?s.expenses:[],currency:s.currency||'ج.م'}}}catch(e){}return{members:[],expenses:[],currency:'ج.م'}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');$('#themeToggle').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
const $=sel=>document.querySelector(sel);
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){const v=Math.abs(Number(n)||0);return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+state.currency}
function initials(name){const parts=String(name).trim().split(/\s+/).slice(0,2);return parts.map(w=>w[0]||'').join('').toUpperCase()||'?'}
function memberById(id){return state.members.find(m=>m.id===id)}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatDate(iso){if(!iso)return'';const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;try{return d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}catch(e){return iso}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function switchTab(name){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name))}
function copyText(text){const done=()=>toast('تم النسخ 📋');const fail=()=>toast('تعذر النسخ');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(fallback)}else{fallback()}function fallback(){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){fail()}document.body.removeChild(ta)}}
function expenseShares(e){const result={};const parts=(e.participants||[]).filter(id=>memberById(id));if(parts.length===0)return result;if(e.splitType==='exact'&&e.splitData){parts.forEach(id=>{result[id]=Number(e.splitData[id])||0})}else if(e.splitType==='percent'&&e.splitData){parts.forEach(id=>{result[id]=e.amount*(Number(e.splitData[id])||0)/100})}else{const each=e.amount/parts.length;parts.forEach(id=>{result[id]=each})}return result}
function memberStats(){const paid={},share={};state.members.forEach(m=>{paid[m.id]=0;share[m.id]=0});state.expenses.forEach(e=>{if(paid[e.payerId]!==undefined)paid[e.payerId]+=e.amount;const shares=expenseShares(e);Object.keys(shares).forEach(id=>{if(share[id]!==undefined)share[id]+=shares[id]})});const bal={};state.members.forEach(m=>{bal[m.id]=Math.round((paid[m.id]-share[m.id])*100)/100});return{paid,share,bal}}
function settlements(){const{bal}=memberStats();const debtors=[],creditors=[];Object.keys(bal).forEach(id=>{const v=bal[id];if(v<-0.005)debtors.push({id,amt:-v});else if(v>0.005)creditors.push({id,amt:v})});debtors.sort((a,b)=>b.amt-a.amt);creditors.sort((a,b)=>b.amt-a.amt);const res=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){const pay=Math.min(debtors[i].amt,creditors[j].amt);if(pay>0.005){res.push({from:debtors[i].id,to:creditors[j].id,amt:Math.round(pay*100)/100})}debtors[i].amt-=pay;creditors[j].amt-=pay;if(debtors[i].amt<0.005)i++;if(creditors[j].amt<0.005)j++}return res}
function render(){ $('#currency').value=state.currency; renderStats(); renderExpenses(); renderMembers(); renderSettle(); renderSummary(); saveState(); }
function renderStats(){const total=state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);$('#statTotal').textContent=money(total);$('#statMembers').textContent=state.members.length;$('#statOps').textContent=state.expenses.length}
function renderExpenses(){const box=$('#expensesList');const bar=$('#filterBar');if(state.expenses.length===0){bar.style.display='none';box.innerHTML='<div class="empty"><span class="emoji">🧾</span><b>مفيش مصاريف لسه</b><span>اضغط على زرار ➕ تحت<br>وسجّل أول مصروف للشلة</span></div>';return}bar.style.display='flex';let list=state.expenses.filter(e=>{if(filterCat!=='all'&&(e.category||'other')!==filterCat)return false;if(filterSearch){const q=filterSearch.toLowerCase();const payer=memberById(e.payerId);const payerName=payer?payer.name.toLowerCase():'';if(!(e.desc||'').toLowerCase().includes(q)&&!payerName.includes(q))return false}return true});const sorters={'date-desc':(a,b)=>(b.date||'').localeCompare(a.date||''),'date-asc':(a,b)=>(a.date||'').localeCompare(b.date||''),'amount-desc':(a,b)=>b.amount-a.amount,'amount-asc':(a,b)=>a.amount-b.amount};list=[...list].sort(sorters[filterSort]||sorters['date-desc']);if(list.length===0){box.innerHTML='<div class="empty"><span class="emoji">🔍</span><b>مفيش نتائج</b><span>جرّب تغيير كلمة البحث أو التصنيف</span></div>';return}box.innerHTML=list.map(e=>{const payer=memberById(e.payerId);const payerName=payer?payer.name:'محذوف';const color=payer?payer.color:'#b2b2c8';const cat=CATEGORIES[e.category]||CATEGORIES.other;const partsCount=(e.participants||[]).length;return `<div class="exp-card"><div class="avatar" style="background:${color}">${esc(initials(payerName))}<div class="exp-cat-badge">${cat.icon}</div></div><div class="exp-main"><div class="exp-title">${esc(e.desc)}</div><div class="exp-meta">${esc(payerName)} دفع • ${formatDate(e.date)} • ${partsCount} مشارك</div></div><div class="exp-right"><div class="exp-amount">${money(e.amount)}</div><div class="exp-actions"><button class="icon-btn" data-edit="${e.id}" title="تعديل">✏️</button><button class="icon-btn" data-del="${e.id}" title="حذف">🗑️</button></div></div></div>`}).join('')}
function renderMembers(){const box=$('#membersList');if(state.members.length===0){box.innerHTML='<div class="empty"><span class="emoji">👥</span><b>ضيف أصحابك الأول</b><span>اكتب اسم الصديق فوق واضغط "إضافة"<br>وبعدين ابدأ تسجّل المصاريف</span></div>';return}const{paid,share,bal}=memberStats();box.innerHTML=state.members.map(m=>{const b=bal[m.id]||0;let cls='zero',txt='متعادل';if(b>0.005){cls='pos';txt='+'+money(b)}else if(b<-0.005){cls='neg';txt='−'+money(b)}return `<div class="member-row" data-open-member="${m.id}"><div class="avatar" style="background:${m.color}">${esc(initials(m.name))}</div><div class="member-info"><div class="member-name">${esc(m.name)}</div><div class="member-sub">دفع ${money(paid[m.id])} • عليه ${money(share[m.id])}</div></div><div class="bal ${cls}">${txt}</div></div>`}).join('')}
function renderSettle(){const box=$('#settleList');if(state.members.length===0){box.innerHTML='<div class="empty"><span class="emoji">🧮</span><b>مفيش حسابات</b><span>ضيف أعضاء وسجّل مصاريف<br>عشان نحسب مين يدفع لمين</span></div>';return}const{bal}=memberStats();const list=settlements();let html='<div class="settle-head">أرصدة الأصدقاء</div>';html+=state.members.map(m=>{const b=bal[m.id]||0;let cls='zero',txt='متعادل';if(b>0.005){cls='pos';txt='ليه '+money(b)}else if(b<-0.005){cls='neg';txt='عليه '+money(b)}return `<div class="member-row" data-open-member="${m.id}"><div class="avatar" style="background:${m.color}">${esc(initials(m.name))}</div><div class="member-info"><div class="member-name">${esc(m.name)}</div></div><div class="bal ${cls}">${txt}</div></div>`}).join('');html+='<div class="settle-head" style="margin-top:16px">أقل عدد تحويلات للتسوية</div>';if(list.length===0){html+='<div class="all-good"><span class="emoji">🎉</span><b>كل الحسابات متساوية</b><span>محدش مديون لحد</span></div>'}else{html+=list.map(s=>{const from=memberById(s.from);const to=memberById(s.to);if(!from||!to)return'';return `<div class="settle-card"><div class="avatar" style="background:${from.color}">${esc(initials(from.name))}</div><div class="settle-names"><b>${esc(from.name)}</b><span class="to">يدفع لـ</span><b>${esc(to.name)}</b></div><div class="settle-amt">${money(s.amt)}</div></div>`}).join('')}const totalDebt=list.reduce((s,x)=>s+x.amt,0);if(list.length>0){html+=`<div class="settle-actions"><button class="btn primary" id="copySettle">📋 نسخ التسوية</button></div><div style="text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;">إجمالي المبالغ المتبادلة: ${money(totalDebt)}</div>`}box.innerHTML=html}
function renderSummary(){const box=$('#summaryContent');if(state.expenses.length===0){box.innerHTML='<div class="empty"><span class="emoji">📊</span><b>مفيش بيانات كفاية</b><span>سجّل شوية مصاريف<br>عشان تشوف الملخص والتحليل</span></div>';return}const total=state.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);const count=state.expenses.length;const avg=total/count;const byCat={};state.expenses.forEach(e=>{const c=e.category||'other';byCat[c]=(byCat[c]||0)+(Number(e.amount)||0)});const catEntries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const{paid}=memberStats();const spenderList=state.members.map(m=>({m,amt:paid[m.id]||0})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt).slice(0,5);const dates=state.expenses.map(e=>e.date).filter(Boolean).sort();const firstDate=dates[0],lastDate=dates[dates.length-1];let days=1;if(firstDate&&lastDate){const d1=new Date(firstDate+'T00:00:00');const d2=new Date(lastDate+'T00:00:00');if(!isNaN(d1)&&!isNaN(d2)){days=Math.max(1,Math.round((d2-d1)/86400000)+1)}}const perDay=total/days;let html=`<div class="sum-card"><h3>💰 نظرة عامة</h3><div class="sum-big">${money(total)}</div><div class="sum-sub">إجمالي المصاريف على مدار ${days} يوم</div><div class="sum-grid"><div class="sum-mini"><strong>${count}</strong><span>عملية</span></div><div class="sum-mini"><strong>${money(avg)}</strong><span>متوسط العملية</span></div><div class="sum-mini"><strong>${money(perDay)}</strong><span>متوسط يومي</span></div></div></div><div class="sum-card"><h3>🏷️ التوزيع حسب التصنيف</h3>${catEntries.map(([key,amt])=>{const cat=CATEGORIES[key]||CATEGORIES.other;const pct=(amt/total)*100;return `<div class="cat-bar-row"><div class="cat-bar-head"><span class="cat-name">${cat.icon} ${cat.label}</span><span>${money(amt)} · ${pct.toFixed(0)}%</span></div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div></div>`}).join('')}</div>`;if(spenderList.length>0){html+=`<div class="sum-card"><h3>🏆 أكتر الناس دفعوا</h3>${spenderList.map((x,i)=>`<div class="spender-row"><span class="spender-rank">#${i+1}</span><div class="avatar" style="width:26px;height:26px;border-radius:8px;font-size:10px;background:${x.m.color}">${esc(initials(x.m.name))}</div><span class="spender-name">${esc(x.m.name)}</span><span class="spender-amt">${money(x.amt)}</span></div>`).join('')}</div>`}box.innerHTML=html}
function buildCategoryOptions(selected){return Object.entries(CATEGORIES).map(([key,cat])=>`<option value="${key}" ${key===selected?'selected':''}>${cat.icon} ${cat.label}</option>`).join('')}
function openExpenseModal(id){if(state.members.length===0){toast('ضيف أصدقاء الأول 👥');switchTab('members');return}editingId=id||null;const exp=id?state.expenses.find(e=>e.id===id):null;$('#expenseModalTitle').textContent=exp?'تعديل المصروف':'مصروف جديد';$('#expDesc').value=exp?exp.desc:'';$('#expAmount').value=exp?exp.amount:'';$('#expNotes').value=exp?(exp.notes||''):'';$('#expDate').value=exp?exp.date:todayISO();$('#expCategory').innerHTML=buildCategoryOptions(exp?(exp.category||'other'):'food');$('#expPayer').innerHTML=state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');if(exp)$('#expPayer').value=exp.payerId;const selectedPids=exp?new Set(exp.participants||[]):new Set(state.members.map(m=>m.id));const splitType=exp?(exp.splitType||'equal'):'equal';document.querySelectorAll('input[name="splitType"]').forEach(r=>{r.checked=(r.value===splitType)});renderParticipants(selectedPids,exp?exp.splitData:null,splitType);$('#overlay').classList.add('show');$('#expenseModal').classList.add('show');document.body.style.overflow='hidden'}
function renderParticipants(selectedSet,splitData,splitType){const container=$('#expParticipants');const isCustom=splitType!=='equal';container.innerHTML=state.members.map(m=>{const checked=selectedSet.has(m.id);const val=splitData&&splitData[m.id]!==undefined?splitData[m.id]:'';return `<div class="p-row ${checked?'':'unchecked'}" data-pid="${m.id}"><label class="p-check-wrap"><input type="checkbox" ${checked?'checked':''} data-pid="${m.id}"><div class="avatar-sm" style="background:${m.color}">${esc(initials(m.name))}</div><span class="p-name">${esc(m.name)}</span></label><input type="number" class="p-value ${isCustom?'':'hidden'}" inputmode="decimal" placeholder="${splitType==='percent'?'0%':'0.00'}" value="${val}" data-pid="${m.id}" ${checked?'':'disabled'}></div>`}).join('');updateSplitTotal()}
function updateSplitTotal(){const type=document.querySelector('input[name="splitType"]:checked').value;const amount=parseFloat($('#expAmount').value)||0;const totalEl=$('#splitTotal');if(type==='equal'){const checked=[...document.querySelectorAll('#expParticipants input[type=checkbox]:checked')];if(checked.length===0){totalEl.className='split-total bad';totalEl.innerHTML='<span>اختار مشارك واحد على الأقل</span>';return}const each=amount/checked.length;totalEl.className='split-total';totalEl.innerHTML=`<span>كل واحد هيدفع</span><span>${money(each)}</span>`;return}let sum=0;document.querySelectorAll('#expParticipants .p-row').forEach(row=>{const cb=row.querySelector('input[type=checkbox]');const inp=row.querySelector('.p-value');if(cb.checked){sum+=parseFloat(inp.value)||0}});sum=Math.round(sum*100)/100;if(type==='exact'){const diff=Math.round((sum-amount)*100)/100;const ok=Math.abs(diff)<0.01;totalEl.className='split-total '+(ok?'ok':'bad');totalEl.innerHTML=`<span>المجموع</span><span>${money(sum)} / ${money(amount)} ${ok?'✓':(diff>0?'(زيادة)':'(ناقص)')}</span>`}else{const ok=Math.abs(sum-100)<0.01;totalEl.className='split-total '+(ok?'ok':'bad');totalEl.innerHTML=`<span>مجموع النسب</span><span>${sum.toFixed(2)}% / 100% ${ok?'✓':''}</span>`}}
function closeExpenseModal(){$('#overlay').classList.remove('show');$('#expenseModal').classList.remove('show');document.body.style.overflow='';editingId=null}
function openMemberModal(id){const m=memberById(id);if(!m)return;viewingMemberId=id;const{paid,share,bal}=memberStats();const b=bal[id]||0;const bCls=b>0.005?'pos':(b<-0.005?'neg':'');const paidCount=state.expenses.filter(e=>e.payerId===id).length;const involvedCount=state.expenses.filter(e=>(e.participants||[]).includes(id)).length;const history=state.expenses.filter(e=>e.payerId===id||(e.participants||[]).includes(id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let html=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div class="avatar" style="width:52px;height:52px;border-radius:16px;font-size:16px;background:${m.color}">${esc(initials(m.name))}</div><div style="flex:1;min-width:0"><input id="memberNameEdit" value="${esc(m.name)}" style="width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:11px;font-family:inherit;font-size:14px;font-weight:800;background:var(--input-bg);color:var(--text);outline:none"></div></div><div class="md-stats"><div class="md-stat"><span>دفع إجمالًا</span><strong>${money(paid[id])}</strong></div><div class="md-stat"><span>عليه إجمالًا</span><strong>${money(share[id])}</strong></div><div class="md-stat ${bCls}"><span>الرصيد</span><strong>${b>0.005?'+':(b<-0.005?'−':'')}${money(b)}</strong></div><div class="md-stat"><span>العمليات</span><strong>${paidCount} دفع • ${involvedCount} مشارك</strong></div></div><div class="settle-head">آخر المصاريف المرتبطة</div>`;if(history.length===0){html+=`<div class="empty" style="padding:24px 12px"><span class="emoji" style="font-size:30px">📭</span><span>مفيش مصاريف مرتبطة بالعضو ده</span></div>`}else{html+=history.slice(0,15).map(e=>{const cat=CATEGORIES[e.category]||CATEGORIES.other;const isPayer=e.payerId===id;return `<div class="exp-card" style="margin-bottom:6px;padding:9px 11px"><div class="avatar" style="width:32px;height:32px;border-radius:10px;font-size:11px;background:${cat.color}">${cat.icon}</div><div class="exp-main"><div class="exp-title" style="font-size:12.5px">${esc(e.desc)}</div><div class="exp-meta" style="font-size:10px">${formatDate(e.date)} • ${isPayer?'دافع':'مشارك'}</div></div><div class="exp-amount" style="font-size:12px">${money(e.amount)}</div></div>`}).join('')}html+=`<div class="modal-foot" style="margin-top:18px"><button class="btn primary" id="saveMemberName">حفظ الاسم</button><button class="btn ghost" id="deleteMemberBtn" style="color:#d63031">حذف العضو</button></div>`;$('#memberModalContent').innerHTML=html;$('#memberModalTitle').textContent='تفاصيل العضو';$('#overlay').classList.add('show');$('#memberModal').classList.add('show');document.body.style.overflow='hidden';$('#saveMemberName').addEventListener('click',()=>{const newName=$('#memberNameEdit').value.trim();if(!newName)return toast('الاسم ما ينفعش يكون فاضي');if(state.members.some(x=>x.id!==id&&x.name.toLowerCase()===newName.toLowerCase()))return toast('في عضو تاني بنفس الاسم');m.name=newName;render();toast('تم تحديث الاسم ✅')});$('#deleteMemberBtn').addEventListener('click',()=>{deleteMember(id)})}
function deleteMember(id){const m=memberById(id);if(!m)return;const related=state.expenses.filter(x=>x.payerId===id||(x.participants||[]).includes(id)).length;const msg=related>0?`حذف ${m.name} هيشيله من ${related} مصروف.\nالمصاريف اللي هو دفعها هتتحذف خالص.\nتكمل؟`:`حذف ${m.name}؟`;if(!confirm(msg))return;state.members=state.members.filter(x=>x.id!==id);state.expenses=state.expenses.filter(x=>x.payerId!==id).map(x=>({...x,participants:(x.participants||[]).filter(p=>p!==id)})).filter(x=>x.participants.length>0);closeMemberModal();render();toast('تم حذف '+m.name)}
function closeMemberModal(){$('#overlay').classList.remove('show');$('#memberModal').classList.remove('show');document.body.style.overflow='';viewingMemberId=null}
function exportData(){const payload={version:1,exportedAt:new Date().toISOString(),data:{members:state.members,expenses:state.expenses,currency:state.currency}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`budget-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('تم تصدير النسخة الاحتياطية ⬇️')}
function importData(file){const reader=new FileReader();reader.onload=e=>{try{const parsed=JSON.parse(e.target.result);let data=parsed;if(parsed.data&&parsed.data.members!==undefined)data=parsed.data;if(!data.members||!data.expenses)throw new Error('bad');if(!confirm('الاستيراد هيدمج البيانات مع اللي موجود.\nمتأكد؟'))return;const byName={};state.members.forEach(m=>{byName[m.name.toLowerCase()]=m});const idMap={};(data.members||[]).forEach(m=>{const key=(m.name||'').toLowerCase();if(byName[key]){idMap[m.id]=byName[key].id}else{const newId=uid();idMap[m.id]=newId;state.members.push({id:newId,name:m.name,color:m.color||PALETTE[state.members.length%PALETTE.length]})}});const existingIds=new Set(state.expenses.map(x=>x.id));let added=0;(data.expenses||[]).forEach(e=>{if(existingIds.has(e.id))return;const newPayer=idMap[e.payerId]||e.payerId;const newParts=(e.participants||[]).map(pid=>idMap[pid]||pid);if(!memberById(newPayer))return;state.expenses.push({...e,id:e.id||uid(),payerId:newPayer,participants:newParts.filter(pid=>memberById(pid))});added++});if(data.currency)state.currency=data.currency;render();toast(`تم استيراد ${added} عملية بنجاح ✅`)}catch(err){toast('الملف غير صالح ❌')}};reader.readAsText(file)}
document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>switchTab(t.dataset.tab))});
$('#themeToggle').addEventListener('click',()=>{const isDark=document.body.classList.contains('dark');applyTheme(isDark?'light':'dark')});
$('#currency').addEventListener('change',e=>{state.currency=e.target.value;render();toast('تم تغيير العملة')});

$('#toggleAll').addEventListener('click',()=>{const boxes=[...document.querySelectorAll('#expParticipants input[type=checkbox]')];const allChecked=boxes.every(b=>b.checked);boxes.forEach(b=>{b.checked=!allChecked;const row=b.closest('.p-row');row.classList.toggle('unchecked',!b.checked);const inp=row.querySelector('.p-value');inp.disabled=!b.checked;inp.value=b.checked?inp.value:''});updateSplitTotal()});
document.querySelectorAll('input[name="splitType"]').forEach(r=>{r.addEventListener('change',()=>{const oldValues={};document.querySelectorAll('#expParticipants .p-row').forEach(row=>{const cb=row.querySelector('input[type=checkbox]');if(cb.checked)oldValues[cb.dataset.pid]=parseFloat(row.querySelector('.p-value').value)||0});const newType=r.value;const amount=parseFloat($('#expAmount').value)||0;const checkedSet=new Set(Object.keys(oldValues));let newValues={};if(newType==='equal')newValues={};else if(newType==='exact'){const sum=Object.values(oldValues).reduce((s,v)=>s+v,0);if(sum>0){Object.entries(oldValues).forEach(([id,v])=>newValues[id]=+(v/sum*amount).toFixed(2))}}else if(newType==='percent'){const sum=Object.values(oldValues).reduce((s,v)=>s+v,0);if(sum>0){Object.entries(oldValues).forEach(([id,v])=>newValues[id]=+(v/sum*100).toFixed(2))}}renderParticipants(checkedSet,newValues,newType)})});

$('#saveExpense').addEventListener('click',()=>{const wasEdit=!!editingId;const desc=$('#expDesc').value.trim();const amount=parseFloat($('#expAmount').value);const payerId=$('#expPayer').value;const date=$('#expDate').value||todayISO();const category=$('#expCategory').value;const notes=$('#expNotes').value.trim();const splitType=document.querySelector('input[name="splitType"]:checked').value;const checkedBoxes=[...document.querySelectorAll('#expParticipants input[type=checkbox]:checked')];const participants=checkedBoxes.map(b=>b.dataset.pid);if(!desc)return toast('اكتب وصف للمصروف ✍️');if(!(amount>0))return toast('اكتب مبلغ صحيح 💵');if(!payerId)return toast('اختار مين اللي دفع');if(participants.length===0)return toast('اختار مشارك واحد على الأقل');let splitData=null;if(splitType==='exact'){splitData={};let sum=0;checkedBoxes.forEach(cb=>{const row=cb.closest('.p-row');const v=parseFloat(row.querySelector('.p-value').value)||0;splitData[cb.dataset.pid]=v;sum+=v});sum=Math.round(sum*100)/100;if(Math.abs(sum-amount)>0.01){return toast(`المبالغ (${sum}) لا تساوي الإجمالي (${amount})`)}}else if(splitType==='percent'){splitData={};let sum=0;checkedBoxes.forEach(cb=>{const row=cb.closest('.p-row');const v=parseFloat(row.querySelector('.p-value').value)||0;splitData[cb.dataset.pid]=v;sum+=v});sum=Math.round(sum*100)/100;if(Math.abs(sum-100)>0.01){return toast(`مجموع النسب (${sum}%) لازم يساوي 100%`)}}if(wasEdit){const e=state.expenses.find(x=>x.id===editingId);if(e)Object.assign(e,{desc,amount,payerId,participants,date,category,notes,splitType,splitData})}else{state.expenses.push({id:uid(),desc,amount,payerId,participants,date,category,notes,splitType,splitData})}closeExpenseModal();render();toast(wasEdit?'تم تعديل المصروف ✅':'تم إضافة المصروف ✅')});
$('#expensesList').addEventListener('click',e=>{const editBtn=e.target.closest('[data-edit]');if(editBtn){openExpenseModal(editBtn.dataset.edit);return}const delBtn=e.target.closest('[data-del]');if(delBtn){if(confirm('تحذف المصروف ده؟')){state.expenses=state.expenses.filter(x=>x.id!==delBtn.dataset.del);render();toast('تم حذف المصروف 🗑️')}}});

$('#catFilter').innerHTML='<option value="all">كل التصنيفات</option>'+Object.entries(CATEGORIES).map(([k,c])=>`<option value="${k}">${c.icon} ${c.label}</option>`).join('');
function addMember(){const input=$('#memberName');const name=input.value.trim();if(!name)return toast('اكتب اسم الصديق');if(state.members.some(m=>m.name.toLowerCase()===name.toLowerCase()))return toast('الاسم ده موجود بالفعل');state.members.push({id:uid(),name,color:PALETTE[state.members.length%PALETTE.length]});input.value='';input.focus();render();toast('تمت إضافة '+name+' 🎉')}

$('#resetAll').addEventListener('click',()=>{if(!confirm('هيتم حذف كل الأعضاء والمصاريف نهائيًا.\nمتأكد؟'))return;state={members:[],expenses:[],currency:state.currency};render();toast('تم إعادة ضبط التطبيق')});
let savedTheme='light';try{savedTheme=localStorage.getItem(THEME_KEY)||'light'}catch(e){}
applyTheme(savedTheme);
render();

<script>
const STORAGE_KEY = 'concreteContractorCalc_v1';
const SECTIONS = ['wood','misc','concrete','transport','received','payments'];
const state = {
  project: { name:'', client:'', date:'', currency:'ج.م', contract:0, received:0, includeWoodInCosts: false, woodPaid: 0 },
  sections: { wood:[], misc:[], concrete:[], transport:[], received:[], payments:[] }
};
let uid = 1;
const newRow = (extra={}) => ({ id: uid++, desc:'', qty:1, price:0, ...extra });
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const money = n => fmt(n) + ' ' + (state.project.currency || 'ج.م');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rowTotal = r => num(r.qty) * num(r.price);
const sum = k => (state.sections[k]||[]).reduce((a,r)=>a+rowTotal(r),0);
function evalFormula(expr){
  if(expr === null || expr === undefined) return 0;
  let s = String(expr).trim(); if(!s) return 0;
  const direct = parseFloat(s);
  if(!isNaN(direct) && /^[+-]?\d+(\.\d+)?$/.test(s)) return direct;
  s = s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/٫/g,'.').replace(/٬/g,'').replace(/,/g,'').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if(!/^[0-9+\-*/().\s]+$/.test(s)) return 0;
  try{ const result = new Function('"use strict"; return (' + s + ');')(); if(!isFinite(result)) return 0; return result < 0 ? 0 : result; }catch(e){ return 0; }
}
function isFormulaValid(expr){ if(!expr) return true; const s = String(expr).trim(); if(!s) return true; const cleaned = s.replace(/[×÷−٫٬]/g,'').replace(/[٠-٩]/g,'').replace(/,/g,''); return /^[0-9+\-*/().\s]*$/.test(cleaned); }
const concreteRowLabor = r => num(r.labor);
const concreteRowValue = r => num(r.qty) * num(r.price);
const concreteRowNet = r => concreteRowValue(r) - concreteRowLabor(r);
const sumConcreteLabor = () => (state.sections.concrete||[]).reduce((a,r)=>a+concreteRowLabor(r),0);
const sumConcreteValue = () => (state.sections.concrete||[]).reduce((a,r)=>a+concreteRowValue(r),0);
const sumConcreteNet = () => (state.sections.concrete||[]).reduce((a,r)=>a+concreteRowNet(r),0);
const dateStamp = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fileBase = () => (String(state.project.name||'مشروع').replace(/[\\/:*?"<>|\n\r\t]/g,'').trim().slice(0,60)||'مشروع') + '-' + dateStamp();
function downloadFile(filename, content, mime){
  try{ const blob = new Blob([content], {type: mime}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 3000); return true; }catch(err){ return false; }
}
function toast(msg, type=''){
  const wrap = $('toast-wrap'); const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(10px)'; setTimeout(()=>el.remove(), 400); }, 3200);
}
function undoToast(msg, onUndo){
  const wrap = $('toast-wrap'); const el = document.createElement('div'); el.className = 'toast info';
  el.innerHTML = `<span>🗑️ ${esc(msg)}</span><span class="undo-btn">↩️ تراجع</span>`;
  el.querySelector('.undo-btn').onclick = () => { el.remove(); onUndo(); };
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.parentNode){ el.style.opacity='0'; setTimeout(()=>el.remove(), 300); } }, 5000);
}
function toggleWoodInclude(){ state.project.includeWoodInCosts = !state.project.includeWoodInCosts; syncWoodToggleUI(); updateTotals(); save(); toast(state.project.includeWoodInCosts ? '✅ الخشب محتسب' : '✅ الخشب منفصل', 'ok'); }
function syncWoodToggleUI(){
  const include = !!state.project.includeWoodInCosts;
  $('wood-include-toggle').classList.toggle('active', include);
  $('wood-toggle-label').textContent = include ? 'محتسبة' : 'غير محتسبة';
  $('wood-card').classList.toggle('included', include);
  $('wood-subtotal-label').textContent = include ? 'إجمالي تكلفة الخشب (محتسبة)' : 'إجمالي تكلفة الخشب (منفصلة)';
  const hint = $('wood-hint');
  hint.classList.toggle('active', include);
  hint.innerHTML = include ? '✅ تكلفة الخشب <b>محتسبة ضمن إجمالي التكاليف</b>.' : '⚠️ تكلفة الخشب معروضة بشكل منفصل -- <b>لا تدخل في إجمالي التكاليف ولا في حساب الربح</b>.';
  $('wood-breakdown-row').classList.toggle('included', include);
  $('wood-breakdown-note').textContent = include ? 'محتسبة داخل التكاليف' : 'غير محتسبة في التكاليف والربح';
  $('costs-label').textContent = include ? 'إجمالي التكاليف (شامل الخشب)' : 'إجمالي التكاليف (بدون خشب)';
}
function bindWoodPaid(){ const inp = $('wood-paid-input'); if(!inp) return; inp.addEventListener('input', ()=>{ state.project.woodPaid = num(inp.value); updateTotals(); save(); }); }
function duplicateRow(key, idx){ const row = state.sections[key][idx]; if(!row) return; const copy = { ...row, id: uid++ }; state.sections[key].splice(idx + 1, 0, copy); renderSection(key); updateTotals(); save(); toast('📋 تم نسخ السطر','ok'); }
function deleteRowWithUndo(key, idx){
  const row = state.sections[key][idx]; if(!row) return;
  const snapshot = { key, idx, row: { ...row } };
  state.sections[key].splice(idx, 1); renderSection(key); updateTotals(); save();
  undoToast(`تم حذف "${row.desc || 'السطر'}"`, () => { if(snapshot.key === key){ state.sections[key].splice(snapshot.idx, 0, snapshot.row); renderSection(key); updateTotals(); save(); toast('↩️ تم التراجع','ok'); } });
}
function renderSection(key){
  const tbody = $(key + '-body'); if(!tbody) return;
  const rows = state.sections[key] || [];
  if(rows.length === 0){ tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">لا توجد بنود بعد -- اضغط "+ إضافة" تحت</div></td></tr>`; return; }
  if(key === 'payments' || key === 'received'){
    tbody.innerHTML = rows.map((r,i)=>`<tr data-idx="${i}"><td><span class="row-num">${i+1}</span></td><td><input data-field="desc" value="${esc(r.desc)}" placeholder="البيان"></td><td><input data-field="date" type="date" value="${esc(r.date||'')}" style="max-width:140px;margin:0 auto"></td><td><input data-field="price" type="number" min="0" step="any" value="${r.price||''}" placeholder="0" style="max-width:140px;margin:0 auto"></td><td><div class="row-actions"><button class="dup" data-dup="${i}">📋</button><button class="del" data-del="${i}">✕</button></div></td></tr>`).join('');
  } else if(key === 'concrete'){
    tbody.innerHTML = rows.map((r,i)=>{
      const labor = concreteRowLabor(r); const net = concreteRowNet(r);
      const expr = (typeof r.laborInput === 'string') ? r.laborInput : String(r.labor || '');
      const invalid = expr && !isFormulaValid(expr);
      const resultClass = invalid ? 'formula-result invalid' : 'formula-result';
      const resultText = invalid ? '⚠ غير صالحة' : '= ' + fmt(labor);
      return `<tr data-idx="${i}"><td><span class="row-num">${i+1}</span></td><td><input data-field="desc" value="${esc(r.desc)}" placeholder="البند"></td><td class="labor-cell"><div class="labor-wrap"><input data-field="laborInput" type="text" value="${esc(expr)}" placeholder="4*400*3" dir="ltr"><div class="${resultClass}">${resultText}</div></div></td><td><input data-field="qty" type="number" min="0" step="any" value="${r.qty||''}" placeholder="0" style="max-width:70px;margin:0 auto"></td><td><input data-field="price" type="number" min="0" step="any" value="${r.price||''}" placeholder="0" style="max-width:90px;margin:0 auto"></td><td class="row-total">${fmt(concreteRowValue(r))}</td><td class="row-net" style="color:${net>=0?'var(--green)':'var(--red)'}">${fmt(net)}</td><td><div class="row-actions"><button class="dup" data-dup="${i}">📋</button><button class="del" data-del="${i}">✕</button></div></td></tr>`;
    }).join('');
  } else {
    tbody.innerHTML = rows.map((r,i)=>`<tr data-idx="${i}"><td><span class="row-num">${i+1}</span></td><td><input data-field="desc" value="${esc(r.desc)}" placeholder="البيان"></td><td><input data-field="qty" type="number" min="0" step="any" value="${r.qty||''}" placeholder="0" style="max-width:100px;margin:0 auto"></td><td><input data-field="price" type="number" min="0" step="any" value="${r.price||''}" placeholder="0" style="max-width:110px;margin:0 auto"></td><td class="row-total">${fmt(rowTotal(r))}</td><td><div class="row-actions"><button class="dup" data-dup="${i}">📋</button><button class="del" data-del="${i}">✕</button></div></td></tr>`).join('');
  }
}
function renderAll(){ SECTIONS.forEach(renderSection); syncWoodToggleUI(); updateTotals(); }
function computeTotals(){
  const wood = sum('wood'); const woodPaid = num(state.project.woodPaid); const woodRemaining = wood - woodPaid;
  const misc = sum('misc'), transport = sum('transport');
  const concreteLabor = sumConcreteLabor();
  const manualPayments = sum('payments'); const received = sum('received');
  const includeWood = !!state.project.includeWoodInCosts;
  const autoWoodPaid = includeWood ? woodPaid : 0;
  const payments = manualPayments + autoWoodPaid;
  const costs = misc + concreteLabor + transport + (includeWood ? wood : 0);
  const contract = num(state.project.contract);
  const profit = contract - costs;
  const margin = contract > 0 ? (profit/contract)*100 : 0;
  const remain = costs - payments;
  const cash = received - payments;
  return {wood, woodPaid, woodRemaining, misc, concreteLabor, transport, payments, manualPayments, autoWoodPaid, received, costs, contract, profit, margin, remain, cash, includeWood};
}
function updateTotals(){
  const t = computeTotals();
  const cLabor = sumConcreteLabor(); const cValue = sumConcreteValue(); const cNet = sumConcreteNet();
  const cMargin = cValue > 0 ? (cNet/cValue)*100 : 0;
  $('wood-total').textContent = money(t.wood);
  $('wood-total-display').textContent = money(t.wood);
  $('wood-remaining-display').textContent = money(t.woodRemaining);
  $('wood-remaining-item').classList.toggle('neg', t.woodRemaining < 0);
  const wpInp = $('wood-paid-input'); if(wpInp && wpInp.value !== String(t.woodPaid || '')) wpInp.value = t.woodPaid || '';
  $('misc-total').textContent = money(sum('misc'));
  $('concrete-total').textContent = money(cLabor);
  $('transport-total').textContent = money(sum('transport'));
  $('received-total').textContent = money(sum('received'));
  const payLabel = $('payments-label'); if(payLabel) payLabel.textContent = t.includeWood ? 'إجمالي المدفوعات (شامل المسدد من الخشب)' : 'إجمالي المدفوعات';
  $('payments-total').textContent = money(t.payments);
  const autoNote = $('auto-wood-note');
  if(autoNote){ if(t.includeWood && t.autoWoodPaid > 0){ autoNote.style.display = 'flex'; $('auto-wood-paid').textContent = money(t.autoWoodPaid); } else autoNote.style.display = 'none'; }
  $('concrete-value').textContent = money(cValue);
  $('concrete-net').textContent = money(cNet);
  $('concrete-margin').textContent = fmt(cMargin) + '%';
  $('concrete-net-box').classList.toggle('neg', cNet < 0);

<!-- Main Loader & PWA Logic                                       -->

<script>
/* ============ Toast ============ */
let appToastTimer;
function appToast(msg){
  const el = document.getElementById('appToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(appToastTimer);
  appToastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ============ Build iframes from templates ============ */
function buildFullHTML(templateId){
  const tpl = document.getElementById(templateId);
  const htmlNode = tpl.content.querySelector('[data-replace="html"]');
  const headNode = tpl.content.querySelector('[data-replace="head"]');
  const bodyNode = tpl.content.querySelector('[data-replace="body"]');
  const lang = htmlNode.getAttribute('lang') || 'ar';
  const dir = htmlNode.getAttribute('dir') || 'rtl';
  return '<!DOCTYPE html>\n<html lang="' + lang + '" dir="' + dir + '">\n<head>\n' +
         headNode.innerHTML + '\n</head>\n<body>\n' +
         bodyNode.innerHTML + '\n</body>\n</html>';
}

function loadIntoFrame(frameId, templateId){
  const iframe = document.getElementById(frameId);
  const html = buildFullHTML(templateId);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
}

function showApp(name){
  document.querySelectorAll('.switcher button[data-app]').forEach(b => {
    b.classList.toggle('active', b.dataset.app === name);
  });
  document.getElementById('concrete-frame').classList.toggle('hidden', name !== 'concrete');
  document.getElementById('budget-frame').classList.toggle('hidden', name !== 'budget');
}

/* ============ PWA / Install ============ */
let deferredPrompt = null;
let isStandalone = false;

function checkStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
    || window.matchMedia('(display-mode: minimal-ui)').matches
    || window.navigator.standalone === true;
}

function updateInstallUI(){
  const banner = document.getElementById('installBanner');
  const toggle = document.getElementById('installToggle');
  if (isStandalone) {
    document.body.classList.add('installed');
    banner.classList.remove('show');
    toggle.classList.add('hidden');
    return;
  }
  document.body.classList.remove('installed');
  toggle.classList.remove('hidden');
}

function showInstallBanner(){
  if (isStandalone) return;
  try {
    if (localStorage.getItem('install-banner-dismissed') === '1') return;
  } catch(e){}
  document.getElementById('installBanner').classList.add('show');
}

function dismissBanner(){
  document.getElementById('installBanner').classList.remove('show');
  try { localStorage.setItem('install-banner-dismissed', '1'); } catch(e){}
}

async function triggerInstall(){
  if (isStandalone) { appToast('✅ التطبيق مثبت بالفعل'); return; }

  if (deferredPrompt) {
    try {
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        appToast('🎉 جاري تثبيت التطبيق...');
        document.getElementById('installBanner').classList.remove('show');
      } else {
        appToast('تم إلغاء التثبيت');
      }
      deferredPrompt = null;
    } catch(e) { appToast('تعذر فتح نافذة التثبيت'); }
    return;
  }

  // Manual instructions
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isFile = location.protocol === 'file:';

  if (isFile) {
    alert('⚠️ الملف مفتوح مباشرة (file://)\n\nللتثبيت الكامل كتطبيق:\n\n1) ارفع الملفات على Netlify أو GitHub Pages (HTTPS)\n2) افتح الرابط من Chrome\n3) اضغط زر التثبيت ⬇️');
    return;
  }

  if (isIOS) {
    alert('📱 للتثبيت على iPhone:\n\n1) اضغط زر المشاركة ⬆️ في Safari\n2) اختار "إضافة إلى الشاشة الرئيسية" ➕\n3) اضغط "إضافة"');
  } else if (isAndroid) {
    alert('📱 للتثبيت على Android:\n\n1) اضغط قائمة المتصفح (⋮)\n2) اختار "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"\n3) اضغط "إضافة"');
  } else {
    alert('📱 للتثبيت:\n\n1) افتح قائمة المتصفح (⋮ أو ...)\n2) ابحث عن "تثبيت" أو "Add to Home Screen"\n3) اضغط عليها');
  }
}

/* ============ Service Worker ============ */
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(() => {
    console.log('[SW] registered');
  }).catch((err) => {
    console.log('[SW] not available:', err.message);
  });
}

/* ============ Bootstrap ============ */
window.addEventListener('DOMContentLoaded', () => {
  // Load frames
  try {
    loadIntoFrame('concrete-frame', 'concrete-src');
    loadIntoFrame('budget-frame', 'budget-src');
  } catch(e) {
    console.error('Frame load error:', e);
    alert('حدث خطأ في تحميل التطبيقات: ' + e.message);
  }

  // Check standalone state
  isStandalone = checkStandalone();
  updateInstallUI();
  window.matchMedia('(display-mode: standalone)').addEventListener?.('change', () => {
    isStandalone = checkStandalone();
    updateInstallUI();
  });

  // Register SW
  registerSW();

  // Show banner after a short delay
  setTimeout(showInstallBanner, 1500);
});

// beforeinstallprompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

window.addEventListener('appinstalled', () => {
  isStandalone = true;
  deferredPrompt = null;
  updateInstallUI();
  document.getElementById('installBanner').classList.remove('show');
  appToast('🎉 تم تثبيت التطبيق بنجاح');
});
</script>
</body>
</html>
